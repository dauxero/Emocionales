version: "3.8"

services:
  emocional-api:
    build: .
    container_name: diario-emocional-api
    ports:
      - "8000:8000"
    environment:
      - HF_HOME=/app/models
      - TRANSFORMERS_CACHE=/app/models
    volumes:
      # Monta main.py para hot-reload en desarrollo
      - ./main.py:/app/main.py
    restart: unless-stopped
